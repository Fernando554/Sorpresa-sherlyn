<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050506" />
  <title>Segunda sorpresa</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <section id="intro" class="screen screen--active intro" aria-labelledby="intro-title">
      <div class="intro__glow"></div>
      <div class="intro__content">
        <p class="kicker">Todavía faltaba algo</p>
        <h1 id="intro-title">¿Lista para tu segunda sorpresa?</h1>
        <p class="intro__hint">Hay una respuesta correcta.</p>

        <div id="choice-zone" class="choice-zone">
          <button id="yes-btn" class="btn btn--yes" type="button">Sí</button>
          <button id="no-btn" class="btn btn--no" type="button">No</button>
        </div>
        <p id="no-message" class="no-message" aria-live="polite"></p>
      </div>
    </section>

    <section id="surprise" class="screen surprise" aria-label="Tu segunda sorpresa">
      <div class="night-sky" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>

      <svg class="coaster" viewBox="0 0 1200 240" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="trackGlow" x1="0" x2="1">
            <stop offset="0" stop-color="#604a19"/>
            <stop offset=".45" stop-color="#f3c64a"/>
            <stop offset="1" stop-color="#604a19"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <path id="ride-path"
              d="M -80 180 C 100 180, 120 55, 260 64
                 S 430 210, 580 130
                 S 760 22, 920 100
                 S 1090 186, 1280 72"
              fill="none" stroke="url(#trackGlow)" stroke-width="8" stroke-linecap="round"
              opacity=".55"/>

        <path d="M -80 199 C 100 199, 120 74, 260 83
                 S 430 229, 580 149
                 S 760 41, 920 119
                 S 1090 205, 1280 91"
              fill="none" stroke="#252219" stroke-width="3" stroke-linecap="round" opacity=".9"/>

        <g id="car" filter="url(#glow)">
          <rect x="-31" y="-17" width="62" height="24" rx="9" fill="#f3c64a"/>
          <rect x="-22" y="-11" width="18" height="10" rx="4" fill="#171717"/>
          <rect x="3" y="-11" width="18" height="10" rx="4" fill="#171717"/>
          <circle cx="-19" cy="10" r="6" fill="#0f0f0f"/>
          <circle cx="19" cy="10" r="6" fill="#0f0f0f"/>
          <animateMotion dur="6.4s" repeatCount="indefinite" rotate="auto">
            <mpath href="#ride-path"/>
          </animateMotion>
        </g>
      </svg>

      <div class="bouquet bouquet--left" aria-hidden="true"></div>
      <div class="bouquet bouquet--right" aria-hidden="true"></div>

      <canvas id="bloom-canvas" class="bloom-canvas" aria-hidden="true"></canvas>

      <div class="hero-flower" id="hero-flower" aria-hidden="true">
        <div class="petal-ring petal-ring--outer" id="outer-petals"></div>
        <div class="petal-ring petal-ring--inner" id="inner-petals"></div>

        <div class="flower-center">
          <div class="seed-field" id="seed-field"></div>
          <div class="flower-message">
            <span class="core-kicker">27 · SEPTIEMBRE</span>
            <strong>NOS VAMOS<br>A SIX FLAGS</strong>
            <span class="core-sub">Festival del Terror</span>
          </div>
        </div>
      </div>

      <div class="proof" id="proof">
        <p class="proof__eyebrow">Y no era broma...</p>
        <h2>Ya está confirmado.</h2>

        <div class="proof-stack">
          <figure class="proof-card proof-card--pass">
            <img src="./assets/gold-pass.jpg" alt="Pase Gold de Six Flags" />
            <figcaption>Gold Pass</figcaption>
          </figure>

          <figure class="proof-card proof-card--order">
            <span class="proof-card__stamp">COMPRADO ✓</span>
            <img src="./assets/pedido-confirmado.jpg" alt="Confirmación del pedido" />
            <figcaption>Pedido confirmado</figcaption>
          </figure>
        </div>

        <p class="proof__copy">Así que sí: nos vamos los dos.</p>

        <div class="warning">
          <span>⚠️</span>
          <p><strong>Pequeña advertencia:</strong><br>Fernando tiene los boletos. Pídeselos a él jajaja.</p>
        </div>

        <button id="restart-btn" class="restart" type="button">Volver a verla</button>
      </div>

      <button id="continue-btn" class="continue-btn" type="button" aria-label="Ver confirmación">
        Ver la prueba ↓
      </button>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
